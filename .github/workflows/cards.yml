name: cards

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  pull_request:
    paths: ["*.py", "*.toml", "requirements*.txt", README.template.md, config.json, fonts/**, .github/workflows/cards.yml]
  push:
    branches: [main]
    paths: ["*.py", "*.toml", "requirements*.txt", README.template.md, config.json, fonts/**, .github/workflows/cards.yml]

permissions:
  contents: read

concurrency:
  group: cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy render.py profile_data.py blueprint.py streak.py

  render:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Capture streak generator errors
        run: |
          mkdir -p "$RUNNER_TEMP/streak-php"
          printf 'error_log = "%s"\n' "$RUNNER_TEMP/streak-errors.log" > "$RUNNER_TEMP/streak-php/streak.ini"
      - name: Generate streak statistics
        uses: DenverCoder1/github-readme-streak-stats@adbd07609bb771d3510a15ee2f3b31d5fbe5201d
        with:
          options: user=giovannirco&card_width=840&card_height=195&disable_animations=true&background=f6f2e8&border=f6f2e8&stroke=cbc1ad&ring=a9690f&fire=a9690f&currStreakNum=28251e&sideNums=28251e&currStreakLabel=a9690f&sideLabels=6a604f&dates=6a604f&date_format=Y-m-d&timezone=UTC
          path: ${{ runner.temp }}/streak-upstream.svg
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          DISABLE_CACHE: "true"
          PHP_INI_SCAN_DIR: :${{ runner.temp }}/streak-php
      - name: Fit streak statistics to the profile
        run: |
          php -r 'if (ini_get("error_log") !== getenv("STREAK_ERROR_LOG")) { exit(1); }'
          python streak.py "$RUNNER_TEMP/streak-upstream.svg" --error-log "$STREAK_ERROR_LOG"
        env:
          PHP_INI_SCAN_DIR: :${{ runner.temp }}/streak-php
          STREAK_ERROR_LOG: ${{ runner.temp }}/streak-errors.log
      - name: Render the profile
        run: python render.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changed cards and metadata
        run: |
          git add cards README.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "cards: refresh"
          git push
  schedule:
    if: always() && github.event_name == 'schedule'
    needs: [check, render]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Keep the schedule enabled
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/cards.yml/enable"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
