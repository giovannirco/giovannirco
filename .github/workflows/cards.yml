name: cards

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  pull_request:
    paths: ["*.py", "*.toml", "requirements*.txt", README.template.md, config.json, fonts/**, .github/workflows/cards.yml]
  push:
    branches: [main]
    paths: ["*.py", "*.toml", "requirements*.txt", README.template.md, config.json, fonts/**, .github/workflows/cards.yml]

permissions:
  contents: read

concurrency:
  group: cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy render.py profile_data.py

  render:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Render the profile
        run: python render.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changed cards and metadata
        run: |
          git add cards README.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "cards: refresh"
          git push
  schedule:
    if: always() && github.event_name == 'schedule'
    needs: [check, render]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Keep the schedule enabled
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/cards.yml/enable"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
