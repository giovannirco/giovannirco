<svg xmlns="http://www.w3.org/2000/svg" width="336" height="140" viewBox="0 0 336 140" role="img" aria-label="CPA Prometheus workflow: requests become metrics for a Grafana dashboard."><title>CPA Prometheus workflow: requests become metrics for a Grafana dashboard.</title><style>@font-face{font-family:Psans;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}.sans{font-family:Psans,system-ui,sans-serif}.mono{font-family:Pmono,monospace}.c-bg{fill:#f6f2e8}.c-line{fill:#cbc1ad}.c-ink{fill:#28251e}.c-muted{fill:#6a604f}.c-accent{fill:#a9690f}.s-bg{stroke:#f6f2e8}.s-line{stroke:#cbc1ad}.s-ink{stroke:#28251e}.s-muted{stroke:#6a604f}.s-accent{stroke:#a9690f}.rule{stroke:#cbc1ad;stroke-width:1}.spark{stroke:#a9690f;stroke-width:2;fill:none}@media(prefers-color-scheme:dark){.c-bg{fill:#14130f}.c-line{fill:#494438}.c-ink{fill:#ece6d8}.c-muted{fill:#b4ac9b}.c-accent{fill:#e8a33d}.s-bg{stroke:#14130f}.s-line{stroke:#494438}.s-ink{stroke:#ece6d8}.s-muted{stroke:#b4ac9b}.s-accent{stroke:#e8a33d}.rule{stroke:#494438;stroke-width:1}.spark{stroke:#e8a33d;stroke-width:2;fill:none}}
.wire,.outline{stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.wire,.outline:not(.c-bg){fill:none}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 3s cubic-bezier(.16,1,.3,1) both}
.signal{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:.035 .965;opacity:0;
animation:signal 12s linear 2s infinite}
.phase{animation-delay:4s}.later{animation-delay:6s}
.scan{animation:scan 10s cubic-bezier(.16,1,.3,1) 1s infinite;opacity:0}
.paper{animation:paper 10s cubic-bezier(.16,1,.3,1) 1s infinite}
.trace{fill:none;stroke-width:1.5;stroke-dasharray:1;stroke-dashoffset:0;
animation:draw 3s cubic-bezier(.16,1,.3,1) both}
.halo{fill:none;stroke-width:1;transform-box:fill-box;transform-origin:center;
animation:halo 12s ease-out 3s infinite;opacity:0}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes signal{0%{stroke-dashoffset:.04;opacity:0}4%{opacity:1}
38%{stroke-dashoffset:-1;opacity:1}42%,100%{stroke-dashoffset:-1;opacity:0}}
@keyframes scan{0%,48%,100%{transform:translateY(0);opacity:0}
8%{transform:translateY(0);opacity:1}36%{transform:translateY(28px);opacity:1}
44%{transform:translateY(28px);opacity:0}}
@keyframes paper{0%,55%,100%{transform:translateY(0)}12%{transform:translateY(-9px)}
38%{transform:translateY(5px)}}
@keyframes halo{0%,38%,100%{opacity:0;transform:scale(1)}
8%{opacity:.7;transform:scale(1)}32%{opacity:0;transform:scale(2)}}
@media(prefers-reduced-motion:reduce){.draw,.signal,.scan,.paper,.trace,.halo{animation:none;transform:none;stroke-dashoffset:0}.signal,.scan,.halo{display:none}}.draw,.signal,.scan,.paper,.trace,.halo{animation:none;transform:none;stroke-dashoffset:0}.signal,.scan,.halo{display:none}</style><rect width="336" height="140" rx="8" class="c-bg"/><path d="M94 63H140" class="wire s-line draw" pathLength="1"/><path d="M94 63H140" class="signal s-accent " pathLength="1" aria-hidden="true"/><path d="M196 63H242" class="wire s-line draw" pathLength="1"/><path d="M196 63H242" class="signal s-accent phase" pathLength="1" aria-hidden="true"/><circle cx="51" cy="46" r="3" class="outline s-muted"/><path d="M59 46h18" class="wire s-muted" /><circle cx="51" cy="63" r="3" class="outline s-muted"/><path d="M59 63h22" class="wire s-muted" /><circle cx="51" cy="80" r="3" class="outline s-muted"/><path d="M59 80h26" class="wire s-muted" /><rect x="148" y="64" width="9" height="19" rx="3" class="outline s-accent"/><rect x="164" y="45" width="9" height="38" rx="3" class="outline s-accent"/><rect x="180" y="55" width="9" height="28" rx="3" class="outline s-accent"/><path d="M143 88h50" class="wire s-line" /><rect x="243" y="39" width="54" height="41" rx="3" class="outline s-muted"/><path d="M261 91h18M270 80v11" class="wire s-muted" /><path d="M250 70l9-9 8 4 8-16 15 6" class="trace s-accent" pathLength="1"/><text x="66" y="117" class="sans c-ink" font-size="12" font-weight="400" text-anchor="middle">Requests</text><text x="168" y="117" class="sans c-ink" font-size="12" font-weight="400" text-anchor="middle">Metrics</text><text x="270" y="117" class="sans c-ink" font-size="12" font-weight="400" text-anchor="middle">Grafana</text></svg>
