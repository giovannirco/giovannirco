<svg xmlns="http://www.w3.org/2000/svg" width="840" height="168" viewBox="0 0 840 168" role="img" aria-label="Platen workflow: PDF documents, print and scan, and filing in Paperless-ngx."><title>Platen workflow: PDF documents, print and scan, and filing in Paperless-ngx.</title><style>@font-face{font-family:Pmono;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:Psans;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}.sans{font-family:Psans,system-ui,sans-serif}.mono{font-family:Pmono,monospace}.c-bg{fill:#f6f2e8}.c-line{fill:#cbc1ad}.c-ink{fill:#28251e}.c-muted{fill:#6a604f}.c-accent{fill:#a9690f}.s-bg{stroke:#f6f2e8}.s-line{stroke:#cbc1ad}.s-ink{stroke:#28251e}.s-muted{stroke:#6a604f}.s-accent{stroke:#a9690f}.rule{stroke:#cbc1ad;stroke-width:1}.spark{stroke:#a9690f;stroke-width:2;fill:none}@media(prefers-color-scheme:dark){.c-bg{fill:#14130f}.c-line{fill:#494438}.c-ink{fill:#ece6d8}.c-muted{fill:#b4ac9b}.c-accent{fill:#e8a33d}.s-bg{stroke:#14130f}.s-line{stroke:#494438}.s-ink{stroke:#ece6d8}.s-muted{stroke:#b4ac9b}.s-accent{stroke:#e8a33d}.rule{stroke:#494438;stroke-width:1}.spark{stroke:#e8a33d;stroke-width:2;fill:none}}
.wire,.outline{stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.wire,.outline:not(.c-bg){fill:none}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 3s cubic-bezier(.16,1,.3,1) both}
.signal{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:.035 .965;opacity:0;
animation:signal 12s linear 2s infinite}
.phase{animation-delay:4s}.later{animation-delay:6s}
.scan{animation:scan 10s cubic-bezier(.16,1,.3,1) 1s infinite;opacity:0}
.paper{animation:paper 10s cubic-bezier(.16,1,.3,1) 1s infinite}
.trace{fill:none;stroke-width:1.5;stroke-dasharray:1;stroke-dashoffset:0;
animation:draw 3s cubic-bezier(.16,1,.3,1) both}
.halo{fill:none;stroke-width:1;transform-box:fill-box;transform-origin:center;
animation:halo 12s ease-out 3s infinite;opacity:0}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes signal{0%{stroke-dashoffset:.04;opacity:0}4%{opacity:1}
38%{stroke-dashoffset:-1;opacity:1}42%,100%{stroke-dashoffset:-1;opacity:0}}
@keyframes scan{0%,48%,100%{transform:translateY(0);opacity:0}
8%{transform:translateY(0);opacity:1}36%{transform:translateY(28px);opacity:1}
44%{transform:translateY(28px);opacity:0}}
@keyframes paper{0%,55%,100%{transform:translateY(0)}12%{transform:translateY(-9px)}
38%{transform:translateY(5px)}}
@keyframes halo{0%,38%,100%{opacity:0;transform:scale(1)}
8%{opacity:.7;transform:scale(1)}32%{opacity:0;transform:scale(2)}}
@media(prefers-reduced-motion:reduce){.draw,.signal,.scan,.paper,.trace,.halo{animation:none;transform:none;stroke-dashoffset:0}.signal,.scan,.halo{display:none}}.draw,.signal,.scan,.paper,.trace,.halo{animation:none;transform:none;stroke-dashoffset:0}.signal,.scan,.halo{display:none}</style><rect width="840" height="168" rx="8" class="c-bg"/><path d="M160 63H392" class="wire s-line draw" pathLength="1"/><path d="M160 63H392" class="signal s-accent " pathLength="1" aria-hidden="true"/><path d="M448 63H680" class="wire s-line draw" pathLength="1"/><path d="M448 63H680" class="signal s-accent phase" pathLength="1" aria-hidden="true"/><path d="M117 43h22l8 8v32h-30zM139 43v8h8" class="outline s-muted" /><path d="M124 60h16M124 66h16M124 72h10" class="wire s-line" /><g class="paper"><rect x="405" y="32" width="30" height="25" rx="3" class="c-bg s-muted outline"/><path d="M412 40h16M412 46h12" class="wire s-line" /></g><rect x="393" y="55" width="54" height="30" rx="3" class="c-bg s-accent outline"/><circle cx="438" cy="64" r="2" class="c-accent"/><rect x="405" y="75" width="30" height="20" rx="3" class="c-bg s-muted outline"/><path d="M411 82h18M411 88h12" class="wire s-line" /><rect x="685" y="39" width="46" height="48" rx="3" class="outline s-muted"/><path d="M685 55h46M702 67h12" class="wire s-line" /><path d="M689 45h38" class="wire s-accent scan" /><text x="132" y="117" class="sans c-ink" font-size="16" font-weight="400" text-anchor="middle">PDF</text><text x="420" y="117" class="sans c-ink" font-size="16" font-weight="400" text-anchor="middle">Print / scan</text><text x="708" y="117" class="sans c-ink" font-size="16" font-weight="400" text-anchor="middle">Paperless</text><text x="32" y="151" class="mono c-muted" font-size="10" font-weight="400" text-anchor="start">PLATEN</text><text x="808" y="151" class="mono c-muted" font-size="10" font-weight="400" text-anchor="end">WORKFLOW</text></svg>
